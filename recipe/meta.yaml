{% set name = "scriv" %}
{% set version = "1.8.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ae0ec6586de4c42994cd2019fde6e870c506a8d85a4eb830d9f53132f9e4eb7c

build:
  entry_points:
    - scriv = scriv.cli:cli
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - attrs >=26.1.0
    - click >=8.5.0
    - click-log >=0.4.0
    - jinja2 >=3.1.6
    - markdown-it-py >=4.2.0
    - requests >=2.34.2

test:
  imports:
    - scriv
  commands:
    - pip check
    - scriv --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/nedbat/scriv
  summary: Scriv changelog management tool
  description: |
    Scriv is a command-line tool for helping developers maintain useful changelogs.
    It manages a directory of changelog fragments. It aggregates them into entries
    in a CHANGELOG file.
  dev_url: https://github.com/nedbat/scriv
  license: Apache-2.0
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - sdebionne
